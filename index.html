<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作業追蹤清單 - 雲端即時同步版</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- 頂端同步狀態條與組別列 -->
    <header class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">作業與訂正追蹤簿</h1>
            <span id="cloudStatus" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-50 text-amber-700 border border-amber-200">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span> 雲端連線中...
            </span>
          </div>
          <p class="text-xs text-slate-500 mt-0.5">Firebase 雲端自動同步 • 跨裝置即時更新</p>
        </div>
        
        <!-- 管理按鈕 -->
        <div class="flex items-center gap-2">
          <button onclick="renameCurrentClass()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg transition">
            ✏️ 重新命名當前組別
          </button>
          <button onclick="addClassPrompt()" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 font-semibold px-2.5 py-1.5 rounded-lg transition">
            + 新增組別
          </button>
          <button onclick="deleteCurrentClass()" class="text-xs text-rose-400 hover:text-rose-600 px-2 py-1.5 transition" title="刪除當前組別">
            🗑️ 刪除
          </button>
        </div>
      </div>
      
      <!-- 組別標籤列 -->
      <div id="classTabs" class="flex flex-wrap gap-2 pt-2 border-t border-slate-100"></div>
    </header>

    <!-- 作業項目區塊 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">目前追蹤作業</h2>
        <button onclick="promptNewTask()" class="text-xs font-semibold bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition">
          + 新增作業
        </button>
      </div>
      
      <!-- 作業選單 Chips -->
      <div id="taskList" class="flex flex-wrap gap-2"></div>
    </section>

    <!-- 學生名冊與狀態點選網格 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
        <div class="flex items-center gap-3">
          <span id="currentTaskTitle" class="font-bold text-slate-900">載入中...</span>
          <span id="currentTaskBadge" class="text-xs px-2 py-0.5 rounded-full font-medium"></span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="markAll('done')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg transition">
            全部完成
          </button>
          <button onclick="editRosterPrompt()" class="text-xs text-slate-400 hover:text-slate-600 px-2 py-1">
            編輯名冊
          </button>
          <button onclick="deleteCurrentTask()" class="text-xs text-rose-400 hover:text-rose-600 px-2 py-1">
            刪除此作業
          </button>
        </div>
      </div>

      <!-- 狀態說明圖例 -->
      <div class="flex gap-4 text-xs text-slate-500">
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> 點擊切換：已完成</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span> 未繳交</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> 待訂正</span>
      </div>

      <!-- 學生卡片網格 -->
      <div id="studentGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-2.5 pt-2"></div>
    </section>

    <!-- 學生待辦總清冊 (表格化結構) -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-3">
        <div>
          <h2 class="text-sm font-bold text-slate-800">全班作業與訂正總清冊（矩陣表格）</h2>
          <p class="text-xs text-slate-500 mt-0.5">點擊表格內任意儲存格即可直接切換狀態</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="copyAllStudentsSummary()" class="text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition">
            📋 複製全班未完成名單
          </button>
        </div>
      </div>

      <!-- 響應式滾動表格容器 -->
      <div class="overflow-x-auto border border-slate-200 rounded-xl">
        <table class="w-full text-xs text-left text-slate-600 border-collapse" id="matrixTable">
          <thead class="bg-slate-50 text-slate-700 font-semibold border-b border-slate-200">
            <tr id="matrixHeaderRow">
              <th class="py-3 px-3 min-w-[70px] bg-slate-50 sticky left-0 z-10 border-r border-slate-200">學生</th>
              <!-- 動態填入各項作業表頭 -->
            </tr>
          </thead>
          <tbody id="matrixTableBody" class="divide-y divide-slate-100 bg-white">
            <!-- 動態填入學生各項作業狀態欄 -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- 單一作業通報文案區 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-700">當前作業通報文案 (LINE / 聯絡簿)</h2>
        <button onclick="copyNotice()" class="text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          一鍵複製
        </button>
      </div>
      <textarea id="noticeText" rows="3" readonly class="w-full text-xs text-slate-700 bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none resize-none font-mono"></textarea>
    </section>

  </div>

  <script>
    const DB_ENDPOINT = "https://homework-tracker-f56a7-default-rtdb.firebaseio.com/homework_tracker_data.json";

    const defaultData = {
      activeClassId: 'c1',
      classes: [
        {
          id: 'c1',
          name: '高年級導師班',
          students: Array.from({ length: 15 }, (_, i) => ({ id: i + 1, name: `${i + 1}號` })),
          tasks: [
            { id: 't1', title: '國語習作 L5', isExternal: false, records: {} },
            { id: 't2', title: '英文作業 (科任)', isExternal: true, records: {} }
          ]
        },
        {
          id: 'c2',
          name: '中年級任課班',
          students: Array.from({ length: 12 }, (_, i) => ({ id: i + 1, name: `${i + 1}號` })),
          tasks: [
            { id: 't3', title: '課堂學習單', isExternal: false, records: {} }
          ]
        }
      ]
    };

    let state = JSON.parse(localStorage.getItem('HW_LOCAL_CACHE')) || defaultData;
    let currentTaskId = state.classes[0]?.tasks[0]?.id || null;

    function updateSyncBadge(status) {
      const el = document.getElementById('cloudStatus');
      if (!el) return;
      if (status === 'synced') {
        el.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-50 text-emerald-700 border border-emerald-200";
        el.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> 雲端已同步';
      } else if (status === 'syncing') {
        el.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-blue-50 text-blue-700 border border-blue-200";
        el.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span> 同步中...';
      } else {
        el.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-rose-50 text-rose-700 border border-rose-200";
        el.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> 連線未通';
      }
    }

    render();

    async function fetchCloudData() {
      try {
        const response = await fetch(DB_ENDPOINT);
        if (!response.ok) throw new Error("Fetch failed");
        const val = await response.json();
        if (val && Array.isArray(val.classes)) {
          state = val;
          localStorage.setItem('HW_LOCAL_CACHE', JSON.stringify(state));
        } else {
          await pushCloudData(defaultData);
        }
        const currentClass = getCurrentClass();
        if (!currentClass.tasks.find(t => t.id === currentTaskId)) {
          currentTaskId = currentClass.tasks[0]?.id || null;
        }
        updateSyncBadge('synced');
        render();
      } catch (err) {
        console.warn("雲端讀取異常：", err);
        updateSyncBadge('error');
      }
    }

    async function pushCloudData(dataToSave) {
      updateSyncBadge('syncing');
      try {
        const res = await fetch(DB_ENDPOINT, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataToSave)
        });
        if (res.ok) {
          updateSyncBadge('synced');
        } else {
          updateSyncBadge('error');
        }
      } catch (e) {
        console.error("雲端寫入失敗：", e);
        updateSyncBadge('error');
      }
    }

    fetchCloudData();
    setInterval(fetchCloudData, 10000);

    function getCurrentClass() {
      return state.classes.find(c => c.id === state.activeClassId) || state.classes[0];
    }

    function saveState() {
      localStorage.setItem('HW_LOCAL_CACHE', JSON.stringify(state));
      pushCloudData(state);
      render();
    }

    function switchClass(classId) {
      state.activeClassId = classId;
      const currentClass = getCurrentClass();
      currentTaskId = currentClass?.tasks[0]?.id || null;
      saveState();
    }

    function renameCurrentClass() {
      const currentClass = getCurrentClass();
      if (!currentClass) return;
      const newName = prompt("請輸入新的組別/班級名稱：", currentClass.name);
      if (newName && newName.trim()) {
        currentClass.name = newName.trim();
        saveState();
      }
    }

    function addClassPrompt() {
      const name = prompt("請輸入新組別/班級名稱：");
      if (!name || !name.trim()) return;
      const newId = 'c_' + Date.now();
      state.classes.push({
        id: newId,
        name: name.trim(),
        students: Array.from({ length: 15 }, (_, i) => ({ id: i + 1, name: `${i + 1}號` })),
        tasks: [
          { id: 't_' + Date.now(), title: '第一份作業', isExternal: false, records: {} }
        ]
      });
      state.activeClassId = newId;
      currentTaskId = state.classes[state.classes.length - 1].tasks[0].id;
      saveState();
    }

    function deleteCurrentClass() {
      if (state.classes.length <= 1) {
        alert("至少需要保留一個組別！");
        return;
      }
      const currentClass = getCurrentClass();
      if (confirm(`確定要刪除「${currentClass.name}」嗎？裡面的所有作業與名冊都會被移除。`)) {
        state.classes = state.classes.filter(c => c.id !== currentClass.id);
        state.activeClassId = state.classes[0].id;
        currentTaskId = state.classes[0].tasks[0]?.id || null;
        saveState();
      }
    }

    function selectTask(taskId) {
      currentTaskId = taskId;
      render();
    }

    function toggleStudentSpecificTask(studentId, taskId) {
      const currentClass = getCurrentClass();
      const task = currentClass.tasks.find(t => t.id === taskId);
      if (!task) return;

      if (!task.records) task.records = {};
      const currentStatus = task.records[studentId] || 'done';
      let nextStatus = 'missing';
      if (currentStatus === 'missing') nextStatus = 'correcting';
      else if (currentStatus === 'correcting') nextStatus = 'done';
      
      task.records[studentId] = nextStatus;
      saveState();
    }

    function toggleStudent(studentId) {
      toggleStudentSpecificTask(studentId, currentTaskId);
    }

    function markAll(status) {
      const currentClass = getCurrentClass();
      const task = currentClass.tasks.find(t => t.id === currentTaskId);
      if (!task) return;
      if (!task.records) task.records = {};
      currentClass.students.forEach(s => {
        task.records[s.id] = status;
      });
      saveState();
    }

    function promptNewTask() {
      const title = prompt("請輸入作業名稱（例如：數習 p.30-32）：");
      if (!title || !title.trim()) return;
      const isExternal = confirm("此項是【代催的科任/外聘作業】嗎？\n[確定] 是科任作業  |  [取消] 本人授課作業");
      const newId = 't_' + Date.now();
      const currentClass = getCurrentClass();
      if (!currentClass.tasks) currentClass.tasks = [];
      currentClass.tasks.push({
        id: newId,
        title: title.trim(),
        isExternal: isExternal,
        records: {}
      });
      currentTaskId = newId;
      saveState();
    }

    function deleteCurrentTask() {
      const currentClass = getCurrentClass();
      const task = currentClass.tasks.find(t => t.id === currentTaskId);
      if (!task) return;
      if (confirm(`確定要刪除「${task.title}」這項作業嗎？`)) {
        currentClass.tasks = currentClass.tasks.filter(t => t.id !== currentTaskId);
        currentTaskId = currentClass.tasks[0]?.id || null;
        saveState();
      }
    }

    function editRosterPrompt() {
      const currentClass = getCurrentClass();
      const currentList = currentClass.students.map(s => s.name).join('、');
      const input = prompt(`請輸入「${currentClass.name}」的學生名冊（以逗號或頓號分隔）：`, currentList);
      if (!input) return;
      const names = input.split(/[,、，\s]+/).filter(Boolean);
      currentClass.students = names.map((name, idx) => ({ id: idx + 1, name: name }));
      saveState();
    }

    function copyNotice() {
      const textarea = document.getElementById('noticeText');
      navigator.clipboard.writeText(textarea.value).then(() => {
        alert("已成功複製通報文字！");
      });
    }

    function copyAllStudentsSummary() {
      const currentClass = getCurrentClass();
      let summaryText = `【${currentClass.name} - 學生未完成作業總清單】\n`;
      let hasAnyPending = false;

      currentClass.students.forEach(student => {
        let pending = [];
        (currentClass.tasks || []).forEach(task => {
          const status = (task.records || {})[student.id] || 'done';
          if (status === 'missing') {
            pending.push(`${task.title} (未交${task.isExternal ? '/科任' : ''})`);
          } else if (status === 'correcting') {
            pending.push(`${task.title} (待訂正${task.isExternal ? '/科任' : ''})`);
          }
        });
        if (pending.length > 0) {
          hasAnyPending = true;
          summaryText += `● ${student.name}：${pending.join('、')}\n`;
        }
      });

      if (!hasAnyPending) {
        summaryText += "目前全班無任何未完成或待訂正作業，全員過關！";
      }

      navigator.clipboard.writeText(summaryText.trim()).then(() => {
        alert("已複製全班學生待辦總清冊！");
      });
    }

    function render() {
      const currentClass = getCurrentClass();
      if (!currentClass) return;

      // 1. 渲染組別標籤列
      const classTabsEl = document.getElementById('classTabs');
      if (classTabsEl) {
        classTabsEl.innerHTML = '';
        state.classes.forEach(c => {
          const isActive = c.id === currentClass.id;
          const btn = document.createElement('button');
          btn.onclick = () => switchClass(c.id);
          btn.className = `px-3.5 py-1.5 text-xs font-semibold rounded-xl border transition ${
            isActive 
              ? 'bg-blue-600 text-white border-blue-600 shadow-sm' 
              : 'bg-slate-100 text-slate-600 border-transparent hover:bg-slate-200'
          }`;
          btn.textContent = c.name;
          classTabsEl.appendChild(btn);
        });
      }

      // 2. 渲染作業清單
      const taskListEl = document.getElementById('taskList');
      if (taskListEl) {
        taskListEl.innerHTML = '';
        if (!currentClass.tasks) currentClass.tasks = [];
        if (!currentClass.tasks.find(t => t.id === currentTaskId) && currentClass.tasks.length > 0) {
          currentTaskId = currentClass.tasks[0].id;
        }

        currentClass.tasks.forEach(t => {
          const isActive = t.id === currentTaskId;
          const btn = document.createElement('button');
          btn.onclick = () => selectTask(t.id);
          btn.className = `px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 border transition ${
            isActive 
              ? 'bg-blue-600 text-white border-blue-600 shadow-sm' 
              : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
          }`;
          
          let typeBadge = t.isExternal 
            ? `<span class="px-1.5 py-0.2 text-[10px] rounded ${isActive ? 'bg-blue-700 text-blue-100' : 'bg-amber-100 text-amber-700'}">科任</span>`
            : '';
          btn.innerHTML = `${typeBadge} ${t.title}`;
          taskListEl.appendChild(btn);
        });
      }

      // 3. 渲染學生狀態網格 (單項作業快速點選)
      const currentTask = currentClass.tasks.find(t => t.id === currentTaskId);
      const studentGrid = document.getElementById('studentGrid');
      if (studentGrid) {
        studentGrid.innerHTML = '';

        if (!currentTask) {
          document.getElementById('currentTaskTitle').textContent = "尚未建立作業";
          document.getElementById('currentTaskBadge').textContent = "";
          document.getElementById('noticeText').value = "";
        } else {
          document.getElementById('currentTaskTitle').textContent = currentTask.title;
          const badge = document.getElementById('currentTaskBadge');
          if (currentTask.isExternal) {
            badge.textContent = "科任代催作業";
            badge.className = "text-xs px-2 py-0.5 rounded-full font-medium bg-amber-50 text-amber-700 border border-amber-200";
          } else {
            badge.textContent = "授課作業";
            badge.className = "text-xs px-2 py-0.5 rounded-full font-medium bg-blue-50 text-blue-700 border border-blue-200";
          }

          let missingList = [];
          let correctingList = [];

          currentClass.students.forEach(student => {
            const records = currentTask.records || {};
            const status = records[student.id] || 'done';
            if (status === 'missing') missingList.push(student.name);
            if (status === 'correcting') correctingList.push(student.name);

            const card = document.createElement('button');
            card.onclick = () => toggleStudent(student.id);

            let colorClasses = "bg-emerald-50 border-emerald-200 text-emerald-800";
            let statusLabel = "已完成";

            if (status === 'missing') {
              colorClasses = "bg-rose-50 border-rose-300 text-rose-800 ring-2 ring-rose-400";
              statusLabel = "未繳交";
            } else if (status === 'correcting') {
              colorClasses = "bg-amber-50 border-amber-300 text-amber-800 ring-2 ring-amber-400";
              statusLabel = "待訂正";
            }

            card.className = `p-3 rounded-xl border flex flex-col items-center justify-center transition active:scale-95 ${colorClasses}`;
            card.innerHTML = `
              <span class="text-sm font-bold truncate max-w-full">${student.name}</span>
              <span class="text-[10px] mt-1 font-semibold opacity-80">${statusLabel}</span>
            `;
            studentGrid.appendChild(card);
          });

          // 單一作業通報文案
          let text = `【${currentClass.name} - ${currentTask.title}追蹤通知】\n`;
          if (currentTask.isExternal) text += `※ 本項為科任老師委請提醒之作業\n`;
          text += `● 未繳交：${missingList.length ? missingList.join('、') : '全數繳交'}\n`;
          text += `● 待訂正：${correctingList.length ? correctingList.join('、') : '無'}`;
          document.getElementById('noticeText').value = text;
        }
      }

      // 4. 渲染結構化矩陣總清冊表格
      const matrixHeaderRow = document.getElementById('matrixHeaderRow');
      const matrixTableBody = document.getElementById('matrixTableBody');

      if (matrixHeaderRow && matrixTableBody) {
        // 重建表頭
        matrixHeaderRow.innerHTML = `<th class="py-2.5 px-3 min-w-[75px] bg-slate-50 sticky left-0 z-10 border-r border-slate-200 text-slate-800">學生姓名</th>`;
        
        const tasks = currentClass.tasks || [];
        tasks.forEach(task => {
          const th = document.createElement('th');
          th.className = "py-2.5 px-3 text-center min-w-[110px] border-r border-slate-200";
          const extTag = task.isExternal ? '<span class="inline-block text-[10px] bg-amber-100 text-amber-700 px-1 py-0.2 rounded ml-1 font-normal">科</span>' : '';
          th.innerHTML = `<div class="truncate max-w-[130px] mx-auto font-medium text-slate-700" title="${task.title}">${task.title}${extTag}</div>`;
          matrixHeaderRow.appendChild(th);
        });

        // 加總待辦欄
        const thSummary = document.createElement('th');
        thSummary.className = "py-2.5 px-3 text-center min-w-[85px] bg-slate-100/60 text-slate-700";
        thSummary.textContent = "待辦項數";
        matrixHeaderRow.appendChild(thSummary);

        // 重建表格主體內容
        matrixTableBody.innerHTML = '';

        currentClass.students.forEach(student => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50/80 transition-colors";

          // 首欄：座號姓名
          let rowHtml = `
            <td class="py-2.5 px-3 font-semibold text-slate-800 bg-white sticky left-0 z-10 border-r border-slate-200 whitespace-nowrap shadow-xs">
              ${student.name}
            </td>
          `;

          let studentPendingCount = 0;

          // 各作業儲存格
          tasks.forEach(task => {
            const status = (task.records || {})[student.id] || 'done';
            let cellContent = '';

            if (status === 'missing') {
              studentPendingCount++;
              cellContent = `<span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded text-[11px] font-bold bg-rose-50 text-rose-600 border border-rose-200">❌ 未交</span>`;
            } else if (status === 'correcting') {
              studentPendingCount++;
              cellContent = `<span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded text-[11px] font-bold bg-amber-50 text-amber-600 border border-amber-200">✏️ 待訂</span>`;
            } else {
              cellContent = `<span class="text-slate-300 font-bold">—</span>`;
            }

            rowHtml += `
              <td onclick="toggleStudentSpecificTask(${student.id}, '${task.id}')" class="py-2 px-2 text-center border-r border-slate-100 cursor-pointer select-none hover:bg-slate-100/60 active:scale-95 transition">
                ${cellContent}
              </td>
            `;
          });

          // 待辦加總欄
          let countBadge = '';
          if (studentPendingCount > 0) {
            countBadge = `<span class="inline-block px-2 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-700">${studentPendingCount} 項</span>`;
          } else {
            countBadge = `<span class="text-emerald-600 font-medium text-xs">✓ 過關</span>`;
          }

          rowHtml += `
            <td class="py-2.5 px-3 text-center bg-slate-50/40 whitespace-nowrap">
              ${countBadge}
            </td>
          `;

          tr.innerHTML = rowHtml;
          matrixTableBody.appendChild(tr);
        });
      }
    }
  </script>
</body>
</html>
