<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作業追蹤清單</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- 頁首與組別/班級切換 -->
    <header class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h1 class="text-xl font-bold text-slate-900 tracking-tight">作業與訂正追蹤簿</h1>
          <p class="text-xs text-slate-500 mt-0.5">極簡點選 • 本地自動存檔</p>
        </div>
        
        <!-- 管理按鈕 -->
        <div class="flex items-center gap-2">
          <button onclick="renameCurrentClass()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg transition">
            ✏️ 重新命名當前組別
          </button>
          <button onclick="addClassPrompt()" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 font-semibold px-2.5 py-1.5 rounded-lg transition">
            + 新增組別
          </button>
          <button onclick="deleteCurrentClass()" class="text-xs text-rose-400 hover:text-rose-600 px-2 py-1.5 transition" title="刪除當前組別">
            🗑️ 刪除
          </button>
        </div>
      </div>
      
      <!-- 組別分頁標籤列 -->
      <div id="classTabs" class="flex flex-wrap gap-2 pt-2 border-t border-slate-100"></div>
    </header>

    <!-- 作業項目區塊 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">目前追蹤作業</h2>
        <button onclick="promptNewTask()" class="text-xs font-semibold bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition">
          + 新增作業
        </button>
      </div>
      
      <!-- 作業選單 Chips -->
      <div id="taskList" class="flex flex-wrap gap-2"></div>
    </section>

    <!-- 學生名冊與狀態點選網格 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
        <div class="flex items-center gap-3">
          <span id="currentTaskTitle" class="font-bold text-slate-900">載入中...</span>
          <span id="currentTaskBadge" class="text-xs px-2 py-0.5 rounded-full font-medium"></span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="markAll('done')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg transition">
            全部完成
          </button>
          <button onclick="editRosterPrompt()" class="text-xs text-slate-400 hover:text-slate-600 px-2 py-1">
            編輯名冊
          </button>
          <button onclick="deleteCurrentTask()" class="text-xs text-rose-400 hover:text-rose-600 px-2 py-1">
            刪除此作業
          </button>
        </div>
      </div>

      <!-- 狀態說明圖例 -->
      <div class="flex gap-4 text-xs text-slate-500">
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> 點擊切換：已完成</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span> 未繳交</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> 待訂正</span>
      </div>

      <!-- 學生卡片網格 -->
      <div id="studentGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-2.5 pt-2"></div>
    </section>

    <!-- 一鍵通報文案區 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-700">聯絡簿 / LINE 通知文字</h2>
        <button onclick="copyNotice()" class="text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          一鍵複製
        </button>
      </div>
      <textarea id="noticeText" rows="3" readonly class="w-full text-xs text-slate-700 bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none resize-none font-mono"></textarea>
    </section>

  </div>

  <script>
    // 預設資料
    const defaultData = {
      activeClassId: 'c1',
      classes: [
        {
          id: 'c1',
          name: '五年級導師班',
          students: Array.from({ length: 15 }, (_, i) => ({ id: i + 1, name: `${i + 1}號` })),
          tasks: [
            { id: 't1', title: '國語習作 L5', isExternal: false, records: {} },
            { id: 't2', title: '英文作業 (科任)', isExternal: true, records: {} }
          ]
        },
        {
          id: 'c2',
          name: '六年級科任班',
          students: Array.from({ length: 12 }, (_, i) => ({ id: i + 1, name: `${i + 1}號` })),
          tasks: [
            { id: 't3', title: '課堂學習單', isExternal: false, records: {} }
          ]
        }
      ]
    };

    // 讀取快取
    let state = JSON.parse(localStorage.getItem('HW_TRACKER_CUSTOM_GROUPS_DATA'));
    // 相容性處理：若為舊版格式則重新載入預設
    if (!state || !Array.isArray(state.classes)) {
      state = defaultData;
    }

    let currentTaskId = getCurrentClass()?.tasks[0]?.id || null;

    function getCurrentClass() {
      return state.classes.find(c => c.id === state.activeClassId) || state.classes[0];
    }

    function saveState() {
      localStorage.setItem('HW_TRACKER_CUSTOM_GROUPS_DATA', JSON.stringify(state));
      render();
    }

    function switchClass(classId) {
      state.activeClassId = classId;
      const currentClass = getCurrentClass();
      currentTaskId = currentClass?.tasks[0]?.id || null;
      saveState();
    }

    function renameCurrentClass() {
      const currentClass = getCurrentClass();
      if (!currentClass) return;
      const newName = prompt("請輸入新的組別/班級名稱：", currentClass.name);
      if (newName && newName.trim()) {
        currentClass.name = newName.trim();
        saveState();
      }
    }

    function addClassPrompt() {
      const name = prompt("請輸入新組別/班級名稱（例如：高年級社團、三年二班）：");
      if (!name || !name.trim()) return;
      const newId = 'c_' + Date.now();
      state.classes.push({
        id: newId,
        name: name.trim(),
        students: Array.from({ length: 15 }, (_, i) => ({ id: i + 1, name: `${i + 1}號` })),
        tasks: [
          { id: 't_' + Date.now(), title: '第一份作業', isExternal: false, records: {} }
        ]
      });
      state.activeClassId = newId;
      currentTaskId = state.classes[state.classes.length - 1].tasks[0].id;
      saveState();
    }

    function deleteCurrentClass() {
      if (state.classes.length <= 1) {
        alert("至少需要保留一個組別！");
        return;
      }
      const currentClass = getCurrentClass();
      if (confirm(`確定要刪除「${currentClass.name}」嗎？裡面的所有作業與名冊都會被移除。`)) {
        state.classes = state.classes.filter(c => c.id !== currentClass.id);
        state.activeClassId = state.classes[0].id;
        currentTaskId = state.classes[0].tasks[0]?.id || null;
        saveState();
      }
    }

    function selectTask(taskId) {
      currentTaskId = taskId;
      render();
    }

    function toggleStudent(studentId) {
      const currentClass = getCurrentClass();
      const task = currentClass.tasks.find(t => t.id === currentTaskId);
      if (!task) return;

      const currentStatus = task.records[studentId] || 'done';
      let nextStatus = 'missing';
      if (currentStatus === 'missing') nextStatus = 'correcting';
      else if (currentStatus === 'correcting') nextStatus = 'done';
      
      task.records[studentId] = nextStatus;
      saveState();
    }

    function markAll(status) {
      const currentClass = getCurrentClass();
      const task = currentClass.tasks.find(t => t.id === currentTaskId);
      if (!task) return;
      currentClass.students.forEach(s => {
        task.records[s.id] = status;
      });
      saveState();
    }

    function promptNewTask() {
      const title = prompt("請輸入作業名稱（例如：數習 p.30-32）：");
      if (!title || !title.trim()) return;
      const isExternal = confirm("此項是【代催的科任/外聘作業】嗎？\n[確定] 是科任作業  |  [取消] 本人授課作業");
      const newId = 't_' + Date.now();
      const currentClass = getCurrentClass();
      currentClass.tasks.push({
        id: newId,
        title: title.trim(),
        isExternal: isExternal,
        records: {}
      });
      currentTaskId = newId;
      saveState();
    }

    function deleteCurrentTask() {
      const currentClass = getCurrentClass();
      const task = currentClass.tasks.find(t => t.id === currentTaskId);
      if (!task) return;
      if (confirm(`確定要刪除「${task.title}」這項作業嗎？`)) {
        currentClass.tasks = currentClass.tasks.filter(t => t.id !== currentTaskId);
        currentTaskId = currentClass.tasks[0]?.id || null;
        saveState();
      }
    }

    function editRosterPrompt() {
      const currentClass = getCurrentClass();
      const currentList = currentClass.students.map(s => s.name).join('、');
      const input = prompt(`請輸入「${currentClass.name}」的學生名冊（以逗號或頓號分隔）：`, currentList);
      if (!input) return;
      const names = input.split(/[,、，\s]+/).filter(Boolean);
      currentClass.students = names.map((name, idx) => ({ id: idx + 1, name: name }));
      saveState();
    }

    function copyNotice() {
      const textarea = document.getElementById('noticeText');
      navigator.clipboard.writeText(textarea.value).then(() => {
        alert("已成功複製通報文字！");
      });
    }

    function render() {
      const currentClass = getCurrentClass();

      // 1. 渲染組別標籤列
      const classTabsEl = document.getElementById('classTabs');
      classTabsEl.innerHTML = '';
      state.classes.forEach(c => {
        const isActive = c.id === currentClass.id;
        const btn = document.createElement('button');
        btn.onclick = () => switchClass(c.id);
        btn.className = `px-3.5 py-1.5 text-xs font-semibold rounded-xl border transition ${
          isActive 
            ? 'bg-blue-600 text-white border-blue-600 shadow-sm' 
            : 'bg-slate-100 text-slate-600 border-transparent hover:bg-slate-200'
        }`;
        btn.textContent = c.name;
        classTabsEl.appendChild(btn);
      });

      // 2. 渲染作業清單
      const taskListEl = document.getElementById('taskList');
      taskListEl.innerHTML = '';

      if (!currentClass.tasks.find(t => t.id === currentTaskId) && currentClass.tasks.length > 0) {
        currentTaskId = currentClass.tasks[0].id;
      }

      currentClass.tasks.forEach(t => {
        const isActive = t.id === currentTaskId;
        const btn = document.createElement('button');
        btn.onclick = () => selectTask(t.id);
        btn.className = `px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 border transition ${
          isActive 
            ? 'bg-blue-600 text-white border-blue-600 shadow-sm' 
            : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
        }`;
        
        let typeBadge = t.isExternal 
          ? `<span class="px-1.5 py-0.2 text-[10px] rounded ${isActive ? 'bg-blue-700 text-blue-100' : 'bg-amber-100 text-amber-700'}">科任</span>`
          : '';
        btn.innerHTML = `${typeBadge} ${t.title}`;
        taskListEl.appendChild(btn);
      });

      // 3. 渲染學生狀態網格
      const currentTask = currentClass.tasks.find(t => t.id === currentTaskId);
      const studentGrid = document.getElementById('studentGrid');
      studentGrid.innerHTML = '';

      if (!currentTask) {
        document.getElementById('currentTaskTitle').textContent = "尚未建立作業";
        document.getElementById('currentTaskBadge').textContent = "";
        document.getElementById('noticeText').value = "";
        return;
      }

      document.getElementById('currentTaskTitle').textContent = currentTask.title;
      const badge = document.getElementById('currentTaskBadge');
      if (currentTask.isExternal) {
        badge.textContent = "科任代催作業";
        badge.className = "text-xs px-2 py-0.5 rounded-full font-medium bg-amber-50 text-amber-700 border border-amber-200";
      } else {
        badge.textContent = "授課作業";
        badge.className = "text-xs px-2 py-0.5 rounded-full font-medium bg-blue-50 text-blue-700 border border-blue-200";
      }

      let missingList = [];
      let correctingList = [];

      currentClass.students.forEach(student => {
        const status = currentTask.records[student.id] || 'done';
        if (status === 'missing') missingList.push(student.name);
        if (status === 'correcting') correctingList.push(student.name);

        const card = document.createElement('button');
        card.onclick = () => toggleStudent(student.id);

        let colorClasses = "bg-emerald-50 border-emerald-200 text-emerald-800";
        let statusLabel = "已完成";

        if (status === 'missing') {
          colorClasses = "bg-rose-50 border-rose-300 text-rose-800 ring-2 ring-rose-400";
          statusLabel = "未繳交";
        } else if (status === 'correcting') {
          colorClasses = "bg-amber-50 border-amber-300 text-amber-800 ring-2 ring-amber-400";
          statusLabel = "待訂正";
        }

        card.className = `p-3 rounded-xl border flex flex-col items-center justify-center transition active:scale-95 ${colorClasses}`;
        card.innerHTML = `
          <span class="text-sm font-bold truncate max-w-full">${student.name}</span>
          <span class="text-[10px] mt-1 font-semibold opacity-80">${statusLabel}</span>
        `;
        studentGrid.appendChild(card);
      });

      // 4. 自動產生通知文案
      let text = `【${currentClass.name} - ${currentTask.title}追蹤通知】\n`;
      if (currentTask.isExternal) text += `※ 本項為科任老師委請提醒之作業\n`;
      text += `● 未繳交：${missingList.length ? missingList.join('、') : '全數繳交'}\n`;
      text += `● 待訂正：${correctingList.length ? correctingList.join('、') : '無'}`;
      document.getElementById('noticeText').value = text;
    }

    render();
  </script>
</body>
</html>
